<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f5d31'/%3E%3Cpath d='M10 44c8-8 13-8 22 0s14 8 22 0' fill='none' stroke='%23f6d56d' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M18 36h28l5 11H13z' fill='%23c43e24'/%3E%3C/svg%3E"
    />
    <title>Jungle Sprint Racer</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud" aria-live="polite">
      <div class="hud-panel">
        <span>Jungle Sprint</span>
        <strong id="speed">0</strong>
        <small>km/h</small>
      </div>
      <div class="hud-panel compact">
        <span>Lap</span>
        <strong id="lap">1/3</strong>
      </div>
      <div class="hud-panel compact">
        <span>Time</span>
        <strong id="time">0:00.0</strong>
      </div>
      <div class="hud-panel compact finish" id="finish" hidden>
        <span>Best</span>
        <strong id="best">--</strong>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
