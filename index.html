<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f5d31'/%3E%3Cpath d='M10 44c8-8 13-8 22 0s14 8 22 0' fill='none' stroke='%23f6d56d' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M18 36h28l5 11H13z' fill='%23c43e24'/%3E%3C/svg%3E"
    />
    <title>Jungle Sprint Racer</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud" aria-live="polite">
      <div class="hud-panel">
        <span>Jungle Sprint</span>
        <strong id="speed">0</strong>
        <small>km/h</small>
      </div>
      <div class="hud-panel compact">
        <span>Lap</span>
        <strong id="lap">1/3</strong>
      </div>
      <div class="hud-panel compact">
        <span>Time</span>
        <strong id="time">0:00.0</strong>
      </div>
      <div class="hud-panel compact finish" id="finish" hidden>
        <span>Best</span>
        <strong id="best">--</strong>
      </div>
    </div>
    <button id="menu-button" class="menu-button" type="button" aria-controls="game-menu" aria-expanded="false">
      Menu
    </button>
    <div id="game-menu" class="game-menu" hidden>
      <section class="menu-panel" role="dialog" aria-labelledby="menu-title">
        <header class="menu-header">
          <div>
            <span>Paused</span>
            <h1 id="menu-title">Jungle Sprint Racer</h1>
          </div>
          <button id="menu-close" class="icon-button" type="button" aria-label="Close menu">x</button>
        </header>
        <div class="menu-stats">
          <div>
            <span>Speed</span>
            <strong id="menu-speed">0 km/h</strong>
          </div>
          <div>
            <span>Lap</span>
            <strong id="menu-lap">0/3</strong>
          </div>
          <div>
            <span>Time</span>
            <strong id="menu-time">0:00.0</strong>
          </div>
        </div>
        <div class="settings-list">
          <label class="setting-row" for="music-toggle">
            <span>BGM</span>
            <input id="music-toggle" type="checkbox" checked />
          </label>
          <label class="setting-row" for="mute-toggle">
            <span>Mute</span>
            <input id="mute-toggle" type="checkbox" />
          </label>
          <label class="setting-row volume-row" for="volume-control">
            <span>Volume</span>
            <input id="volume-control" type="range" min="0" max="1" step="0.01" value="0.45" />
          </label>
        </div>
        <button id="menu-resume" class="resume-button" type="button">Resume</button>
      </section>
    </div>
    <div id="race-summary" class="race-summary" hidden>
      <section class="summary-panel" role="dialog" aria-labelledby="summary-title" aria-live="polite">
        <span>Race Complete</span>
        <h2 id="summary-title">Congratulations</h2>
        <div class="summary-grid">
          <div>
            <span>Total</span>
            <strong id="summary-total">0:00.0</strong>
          </div>
          <div>
            <span>Best Lap</span>
            <strong id="summary-best">--</strong>
          </div>
          <div>
            <span>Laps</span>
            <strong id="summary-laps">3/3</strong>
          </div>
        </div>
        <button id="summary-replay" class="resume-button" type="button">Replay</button>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
